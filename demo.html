<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>厂站网一体化超前感知与协同调控 · 主题七</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#00796b">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<style>
:root{--ink:#0d2b33;--teal:#0f6f6c;--teal-d:#0a4f4d;--amber:#b7791f;--paper:#f5f2ea;--muted:#5f6f74}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;min-height:100vh;display:flex;
 align-items:center;justify-content:center;color:var(--ink);padding:20px;
 background:
   repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 96px),
   repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 96px),
   linear-gradient(160deg,#0a232b,#0d2b33 60%,#0e3a40)}
.gate{width:100%;max-width:440px}
.gate-card{background:#fffdf8;border:1px solid #d9d2c2;border-top:4px solid var(--amber);border-radius:4px;
 box-shadow:0 18px 60px rgba(0,0,0,.4);padding:36px 32px 24px;text-align:center}
.gate-drop{line-height:1}
.gate-drop svg{display:inline-block}
.gate-card h1{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,serif;font-size:1.24rem;
 color:var(--teal-d);margin:12px 0 4px}
.gate-sub{color:var(--muted);font-size:.88rem;margin-bottom:22px}
#gate-input{width:100%;padding:12px 14px;border:1px solid #b9ae97;border-radius:3px;font-size:1rem;
 text-align:center;letter-spacing:.15em;outline:none;background:#fff;font-family:ui-monospace,Consolas,monospace}
#gate-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,111,108,.15)}
#gate-btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:3px;background:var(--teal);
 color:#fff;font-size:1rem;cursor:pointer;transition:background .15s;font-family:inherit;letter-spacing:.08em}
#gate-btn:hover{background:var(--teal-d)}
#gate-btn:disabled{opacity:.7;cursor:default}
.gate-err{color:#a63a2e;font-size:.85rem;min-height:1.3em;margin-top:10px}
.gate-remember{display:block;color:var(--muted);font-size:.84rem;margin-top:10px}
.gate-remember a{color:var(--teal-d)}
.gate-note{color:#8b968f;font-size:.78rem;margin-top:16px;line-height:1.7}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .45s}
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-drop"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0f6f6c" stroke-width="1.5"><path d="M12 2.6c3.4 4.3 6.4 8 6.4 11.6a6.4 6.4 0 1 1-12.8 0C5.6 10.6 8.6 6.9 12 2.6z"/><path d="M8.6 14.4a3.4 3.4 0 0 0 3.4 3.4" stroke="#b7791f"/></svg></div>
    <h1>主题七 · 成果展示站</h1>
    <p class="gate-sub">厂站网一体化超前感知与协同调控 ｜ 受保护站点</p>
    <input id="gate-input" type="password" placeholder="请输入访问口令" autocomplete="off">
    <button id="gate-btn">进入</button>
    <p id="gate-err" class="gate-err"></p>
    <p class="gate-remember" id="gate-forget" style="display:none">已在本设备记住口令 · <a href="#" id="gate-clear">清除</a></p>
    <p class="gate-note">站点内容以口令派生密钥 AES-256-GCM 加密存储，浏览器内解密；<b>本设备首次登录后自动记住</b>（可清除）；无口令者仅能获取密文。</p>
  </div>
</div>
<script src="assets/gate.js"></script>
</body>
</html>
